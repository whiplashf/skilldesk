[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skilldesk"
version = "0.1.0"
description = "Manage installed agent skills, track their GitHub releases, and organize reusable prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
browser = ["pytest>=8", "playwright>=1.44"]

[project.scripts]
skilldesk = "skilldesk.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }
packages = ["skilldesk"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py310"
